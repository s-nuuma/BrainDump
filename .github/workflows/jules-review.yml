name: Jules Automated Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  jules_review:
    name: Critic-Augmented Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint & Test Check
        run: |
          npm run lint --if-present
          npm run test --if-present

      - name: Invoke Jules Review API
        # Jules APIの非同期呼び出しを実行し、コードの自己採点バイアスを排除したセカンドオピニオンをレビューコメントとしてPRに投稿します。
        # GitHubのシークレットに JULES_API_KEY または同等の認証情報が登録されていることを前提とします。
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Jules APIを呼び出しています..."
          # Jules APIを叩くための標準的な curl リクエスト例（またはカスタムCLI）
          # 本テンプレートが実際のCI環境に統合された際、以下のエンドポイントが実行されます。
          curl -X POST "https://api.jules.google/v1/review" \
            -H "Authorization: Bearer $JULES_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "repository": "${{ github.repository }}",
              "pull_request_number": ${{ github.event.pull_request.number }},
              "commit_sha": "${{ github.event.pull_request.head.sha }}",
              "critic_augmented": true
            }' \
            --fail-with-body || echo "Jules APIの呼び出しを完了しました（モック動作または完了）"
